<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Segoe UI, Arial, sans-serif">
  <rect width="760" height="300" fill="#ffffff"/>
  <defs>
    <marker id="seta" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <g stroke="#1f2937" stroke-width="2" fill="#e0f2fe">
    <rect x="20" y="110" width="150" height="70" rx="10"/>
    <rect x="230" y="110" width="150" height="70" rx="10" fill="#dcfce7"/>
    <rect x="440" y="110" width="150" height="70" rx="10" fill="#fef9c3"/>
    <rect x="600" y="30" width="140" height="70" rx="10" fill="#fce7f3"/>
    <rect x="600" y="200" width="140" height="70" rx="10" fill="#ede9fe"/>
  </g>
  <g font-size="16" fill="#111827" text-anchor="middle">
    <text x="95" y="140" font-weight="bold">Cliente HTTP</text>
    <text x="95" y="162" font-size="13">JSON</text>
    <text x="305" y="140" font-weight="bold">Controller</text>
    <text x="305" y="162" font-size="13">DTOs validados</text>
    <text x="515" y="140" font-weight="bold">Service</text>
    <text x="515" y="162" font-size="13">regras RN1 a RN8</text>
    <text x="670" y="60" font-weight="bold">Repository</text>
