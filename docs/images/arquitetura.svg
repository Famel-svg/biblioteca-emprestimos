    <text x="670" y="230" font-weight="bold">PostgreSQL</text>
    <text x="670" y="252" font-size="13">schema via Flyway</text>
  </g>
  <g stroke="#374151" stroke-width="2" fill="none" marker-end="url(#seta)">
    <line x1="170" y1="145" x2="230" y2="145"/>
