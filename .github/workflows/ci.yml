name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Testes e cobertura (JaCoCo >= 80%)
        run: ./mvnw -B verify

      - name: Build da imagem Docker
        run: docker build -t biblioteca-emprestimos:${{ github.sha }} .
